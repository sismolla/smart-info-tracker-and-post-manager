<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>You're Offline – Market Intelligence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-100: #dbeafe;
      --slate-50:  #f8fafc;
      --slate-200: #e2e8f0;
      --slate-500: #64748b;
      --slate-700: #334155;
      --slate-900: #0f172a;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--slate-50);
      color: var(--slate-700);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    /* ── Logo ─────────────────────────────────────────────── */
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
    }

    .logo-text {
      font-size: 2rem;
      font-weight: 700;
      color: white;
      letter-spacing: -1px;
      line-height: 1;
    }

    /* ── Cloud-off icon (pure CSS) ────────────────────────── */
    .offline-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      position: relative;
    }

    .offline-icon svg {
      width: 100%;
      height: 100%;
      color: var(--slate-500);
    }

    /* ── Text content ─────────────────────────────────────── */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--slate-500);
      max-width: 320px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    /* ── Button ───────────────────────────────────────────── */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--blue-600);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-retry:hover {
      background: var(--blue-700);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-retry:active {
      transform: scale(0.97);
    }

    /* ── Info chip ────────────────────────────────────────── */
    .info-chip {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--blue-100);
      color: var(--blue-600);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--slate-500);
    }

    /* ── Spinner animation (shows while checking) ─────────── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
  </style>
</head>
<body>

  <!-- App logo -->
  <div class="logo" aria-hidden="true">
    <span class="logo-text">MI</span>
  </div>

  <!-- Offline icon -->
  <div class="offline-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>You're Offline</h1>
  <p class="subtitle">
    It looks like your connection dropped. Check your internet and try again&nbsp;—&nbsp;we'll be here when you're back.
  </p>

  <button class="btn-retry" id="retryBtn" onclick="handleRetry()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="retryIcon">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    <span id="retryLabel">Try Again</span>
  </button>

  <div class="info-chip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/>
    </svg>
    Some pages may be available from cache
  </div>

  <footer>Market Intelligence &copy; 2024</footer>

  <script>
    function handleRetry() {
      const btn = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const label = document.getElementById('retryLabel');

      // Show spinner
      icon.classList.add('spin');
      label.textContent = 'Checking…';
      btn.disabled = true;

      // Try fetching a lightweight endpoint to verify connectivity
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          // Connection restored — navigate back
          window.location.href = window.location.origin;
        })
        .catch(() => {
          // Still offline — reset button
          icon.classList.remove('spin');
          label.textContent = 'Try Again';
          btn.disabled = false;

          // Brief shake feedback
          btn.style.animation = 'none';
          btn.style.transform = 'translateX(-4px)';
          setTimeout(() => { btn.style.transform = 'translateX(4px)'; }, 80);
          setTimeout(() => { btn.style.transform = ''; }, 160);
        });
    }

    // Auto-reload when connectivity returns
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
