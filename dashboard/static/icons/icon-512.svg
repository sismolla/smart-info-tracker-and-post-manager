<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg512)"/>
  <!-- Top shine overlay -->
  <rect width="512" height="256" rx="110" ry="110" fill="url(#shine)"/>
  <!-- Border glow -->
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>
  <!-- "MI" text centered -->
  <text
    x="256"
    y="315"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="220"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-6"
  >MI</text>
  <!-- Decorative accent dots -->
  <circle cx="380" cy="138" r="22" fill="rgba(255,255,255,0.35)"/>
  <circle cx="410" cy="108" r="10" fill="rgba(255,255,255,0.2)"/>
</svg>
