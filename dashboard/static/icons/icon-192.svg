<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <clipPath id="rounded">
      <rect width="192" height="192" rx="40" ry="40"/>
    </clipPath>
  </defs>
  <!-- Rounded square background -->
  <rect width="192" height="192" rx="40" ry="40" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="192" height="192" rx="40" ry="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- "MI" text centered -->
  <text
    x="96"
    y="118"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="80"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2"
  >MI</text>
  <!-- Small decorative dot accent -->
  <circle cx="143" cy="52" r="8" fill="rgba(255,255,255,0.4)"/>
</svg>
